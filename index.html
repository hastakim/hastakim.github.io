<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hastakim's Tools</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f0f; }

  #nav {
    display: flex; height: 52px;
    background: #111; border-bottom: 1px solid #262626;
  }
  #nav button {
    flex: 1; border: none; background: transparent; color: #999;
    font-size: 0.92rem; font-weight: 600; cursor: pointer;
    border-bottom: 3px solid transparent; transition: all .15s;
  }
  #nav button:hover { color: #ddd; background: #181818; }
  #nav button.active { color: #fff; border-bottom-color: #27ae60; }
  #nav button.active#tab-journal { border-bottom-color: #e74c3c; }

  #frame-wrap { position: absolute; top: 52px; left: 0; right: 0; bottom: 0; }
  iframe { width: 100%; height: 100%; border: none; display: block; background: #fff; }
</style>
</head>
<body>

<div id="nav">
  <button id="tab-calc" class="active" onclick="loadApp('calc')">🧮 Patent Calculator</button>
  <button id="tab-journal" onclick="loadApp('journal')">🔒 Private Journal</button>
</div>

<div id="frame-wrap">
  <iframe id="app-frame" src="calculator.html" title="app"></iframe>
</div>

<script>
const SOURCES = { calc: 'calculator.html', journal: 'journal.html' };
let current = 'calc';

function loadApp(name) {
  if (name === current) return;
  document.getElementById('tab-' + current).classList.remove('active');
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('app-frame').src = SOURCES[name];
  current = name;
}
</script>

</body>
</html>
